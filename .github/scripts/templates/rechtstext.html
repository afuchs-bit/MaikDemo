<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<style>
html, body { background-color: #171916; }
@media (max-width: 480px) {
  html, body { background-color: #1B1E19; }
}
</style>
<!-- AP-01: Demo-Sperre. Beim Go-Live entfernen (Impressum darf indexiert werden), siehe docs/go-live-checkliste.md. -->
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#315200" />
<!-- AUTO-GENERIERT von .github/scripts/build-rechtstexte.mjs aus content/rechtstexte/{{slug}}.* – NICHT von Hand editieren. -->
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{canonical}}" />
<meta property="og:title" content="{{ogTitle}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:image" content="{{ogImage}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{canonical}}" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="icon" href="{{base}}assets/img/logo/favicon.png?v=20261007a" type="image/png" sizes="64x64" />
<link rel="preload" href="/assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="{{base}}assets/css/styles.css?v={{cssVersion}}" />
<link rel="stylesheet" href="{{base}}assets/css/header-home.css?v={{cssVersion}}" />
<link rel="stylesheet" href="{{base}}assets/css/footer-kontakt.css?v=20261007a" />

<!-- Breadcrumb (AEO/SEO) -->
<script type="application/ld+json">
{{breadcrumbJsonLd}}
</script>
<link rel="stylesheet" href="{{base}}assets/css/social-brand.css?v=20261006b" />
<link rel="stylesheet" href="{{base}}assets/css/brand-artwork.css?v=20261007a" />
</head>
<body>

{{logo}}

{{header}}

<main id="top">

<!-- ============ RECHTSTEXT ============ -->
<section class="section section-rechtstext" aria-labelledby="rt-title">
  <div class="container">

    <nav class="breadcrumbs breadcrumbs--home-back reveal" aria-label="Brotkrumennavigation">
      <ol>
        <li class="breadcrumbs__back">
          <a href="{{base}}">
            <img class="breadcrumbs__back-icon" src="{{base}}assets/img/icons/maik-rohdich-cta-pfeil-rechts.svg" alt="" width="1883" height="567" aria-hidden="true" decoding="async">
            <span>Startseite</span>
          </a>
        </li>
        <li class="breadcrumbs__current" aria-current="page">{{h1}}</li>
      </ol>
    </nav>

    <div class="section-head rt-head reveal">
      <h1 class="type-page-title" id="rt-title">{{h1}}</h1>
    </div>

    <div class="rt-body reveal">
      {{body}}
    </div>

  </div>
</section>

</main>

{{footer}}

<script src="{{base}}assets/js/main.js?v={{jsVersion}}" defer></script>
</body>
</html>
