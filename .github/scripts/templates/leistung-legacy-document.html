<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#315200" />
<!-- AUTO-GENERIERT von .github/scripts/build-leistungen.mjs aus content/leistungen/{{slug}}.json – NICHT von Hand editieren. -->
<title>{{title}}</title>
<meta name="description" content="{{description}}" />
<link rel="canonical" href="{{canonical}}" />
<meta property="og:title" content="{{ogTitle}}" />
<meta property="og:description" content="{{description}}" />
<meta property="og:image" content="{{ogImage}}" />
<meta property="og:type" content="website" />
<meta property="og:url" content="{{canonical}}" />
<link rel="icon" href="{{base}}assets/img/logo/favicon.svg" type="image/svg+xml" />
<link rel="preload" href="/assets/fonts/outfit-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="{{base}}assets/css/styles.css?v={{cssVersion}}" />
<link rel="stylesheet" href="{{base}}assets/css/header-home.css?v=20260924x" media="(max-width: 900px)" />
<link rel="stylesheet" href="{{base}}assets/css/footer-kontakt.css?v=20260921f" />
<script type="application/ld+json">{{breadcrumbJsonLd}}</script>
<script type="application/ld+json">{{serviceJsonLd}}</script>
<script type="application/ld+json">{{faqJsonLd}}</script>
</head>
<body class="lp-service-page">
{{logo}}
{{header}}
<main id="top">
  <article class="section section-leistung" aria-labelledby="lp-title">
    <div class="container">
      <nav class="breadcrumbs reveal" aria-label="Sie sind hier"><ol>{{breadcrumbTrail}}</ol></nav>
      <div class="section-head lp-head reveal">
        <span class="kicker">Leistung</span>
        <h1 class="type-page-title" id="lp-title">{{h1}}</h1>
        <p class="type-subsection-title">{{subheading}}</p>
        <div class="lead type-hero-lead">{{introHtml}}</div>
        <a class="btn btn-primary" href="{{contactHref}}">{{ctaLabel}}</a>
      </div>
      <section class="lp-block reveal" aria-labelledby="lp-details">
        <h2 class="type-subsection-title" id="lp-details">Das sollten Sie wissen</h2>
        {{contentHtml}}
      </section>
      <section class="lp-block reveal" aria-labelledby="lp-faq">
        <h2 class="type-subsection-title" id="lp-faq">Häufige Fragen</h2>
        {{faqHtml}}
      </section>
      <div class="projekt-cta center reveal">
        <p>{{closing}}</p>
        <a class="btn btn-primary" href="{{contactHref}}">{{ctaLabel}} <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </article>
</main>
{{footer}}
<script src="{{base}}assets/js/main.js?v={{jsVersion}}" defer></script>
</body>
</html>
